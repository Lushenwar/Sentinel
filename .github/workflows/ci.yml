name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # unit tests mock all external boundaries; test_db_integration runs its SQL against the service below
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      SENTINEL_DB_TESTS: "1"
      ANTHROPIC_API_KEY: ci-dummy
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e core/ pytest jsonschema black flake8
      - run: black --check --line-length 110 core sandbox eval
      - run: flake8 core sandbox eval
      - run: pytest core/tests eval/tests -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      # ponytail: npm install, not npm ci — Windows-generated lockfiles omit optional
      # wasm-binding deps (@emnapi/*) that Linux npm ci then rejects
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
